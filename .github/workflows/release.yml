name: Build and release firmware

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select next version
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const tags = await github.paginate(github.rest.repos.listTags, {
              ...context.repo, per_page: 100
            });
            const versions = tags
              .filter(tag => /^v\d+\.\d+\.\d+$/.test(tag.name))
              .map(tag => ({
                ...tag,
                parts: tag.name.slice(1).split('.').map(Number)
              }))
              .sort((a, b) => b.parts[0] - a.parts[0] ||
                b.parts[1] - a.parts[1] || b.parts[2] - a.parts[2]);
            // A retry of an already released commit must reuse its version.
            const existing = versions.find(tag => tag.commit.sha === context.sha);
            let version = '1.0.0';
            if (existing) {
              version = existing.name.slice(1);
            } else if (versions.length) {
              const [major, minor, patch] = versions[0].parts;
              version = `${major}.${minor}.${patch + 1}`;
            }
            core.setOutput('number', version);
            core.setOutput('tag', `v${version}`);

      - name: Install build dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends cmake ninja-build libusb-1.0-0-dev

      - name: Cache Arm GNU toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi
          key: arm-gnu-14.2.rel1-linux-x86_64-arm-none-eabi

      - name: Set up Arm GNU toolchain
        timeout-minutes: 10
        env:
          CACHE_HIT: ${{ steps.toolchain.outputs.cache-hit }}
          PICO_TOOLCHAIN_PATH: ${{ runner.temp }}/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi
        run: |
          if [ "$CACHE_HIT" != "true" ]; then
            archive="$RUNNER_TEMP/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz"
            curl --fail --location --retry 2 --connect-timeout 30 --max-time 180 \
              https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz \
              --output "$archive"
            echo "62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823  $archive" | sha256sum --check
            tar -xJf "$archive" -C "$RUNNER_TEMP"
            rm "$archive"
          fi
          "$PICO_TOOLCHAIN_PATH/bin/arm-none-eabi-gcc" --version
          echo "PICO_TOOLCHAIN_PATH=$PICO_TOOLCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Download Pico SDK 2.2.0
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: |
          git clone --branch 2.2.0 --depth 1 https://github.com/raspberrypi/pico-sdk.git "$PICO_SDK_PATH"
          git -C "$PICO_SDK_PATH" submodule update --init --depth 1 lib/cyw43-driver lib/lwip lib/tinyusb lib/mbedtls
          echo "PICO_SDK_PATH=$PICO_SDK_PATH" >> "$GITHUB_ENV"

      - name: Configure firmware
        env:
          FIRMWARE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICOCALC_VNC_VERSION="$FIRMWARE_VERSION"

      - name: Build firmware
        run: cmake --build build --parallel 2

      - name: Test updater format validation
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc tests/update_format_test.c src/update_format.c -o build/update-format-test
          build/update-format-test build/picocalc_vnc.uf2

      - name: Test updater download and replacement
        run: |
          cc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Itests/stubs -Ithird_party/fatfs tests/update_download_test.c -Wl,--gc-sections -o build/update-download-test
          build/update-download-test

      - name: Test brightness settings
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Itests/stubs -Ithird_party/fatfs tests/brightness_test.c -o build/brightness-test
          build/brightness-test

      - name: Test progress spinner
        run: |
          cc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Itests/stubs tests/progress_test.c -Wl,--gc-sections -o build/progress-test
          build/progress-test
          cc -std=c11 -Wall -Wextra -Werror -pthread -Itests/stubs tests/lcd_spinner_test.c src/font_6x12.c -o build/lcd-spinner-test
          build/lcd-spinner-test

      - name: Prepare release assets
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          test -s build/picocalc_vnc.uf2
          mkdir -p dist
          cp build/picocalc_vnc.uf2 "dist/picocalc_vnc-${TAG}.uf2"
          cd dist
          sha256sum "picocalc_vnc-${TAG}.uf2" > SHA256SUMS

      - name: Create release
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const tag = process.env.TAG;
            try {
              await github.rest.repos.getReleaseByTag({...context.repo, tag});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `PicoCalc VNC ${tag}`,
                generate_release_notes: true,
                body: 'Copy the UF2 to pico2-apps/ on the SD card and launch it from UF2Loader.'
              });
            }

      - name: Upload firmware and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
